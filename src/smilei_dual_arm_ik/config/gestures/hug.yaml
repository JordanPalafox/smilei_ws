# Gesture: Hug
# Description: A gesture to express affection

# Execution parameters
synchronized: false  # Independent arm motion
interpolation_method: 'cubic'
steps_per_segment: 15

# Right arm waypoints (pointing gesture)
right_arm_waypoints:

- {x: 0.320, y: 0.020, z: 0.310}
- {x: 0.280, y: 0.120, z: 0.310}
- {x: 0.240, y: 0.150, z: 0.310}
- {x: 0.200, y: 0.170, z: 0.310}
- {x: 0.150, y: 0.170, z: 0.310}

# Left arm waypoints (stays in rest position)
left_arm_waypoints:
  # Waypoint 1
- {x: -0.320, y: 0.020, z: 0.310}
- {x: -0.280, y: 0.120, z: 0.310}
- {x: -0.240, y: 0.150, z: 0.310}
- {x: -0.200, y: 0.170, z: 0.310}
- {x: -0.150, y: 0.170, z: 0.310}
