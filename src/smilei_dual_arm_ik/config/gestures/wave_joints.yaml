# Gesture: Wave (Joint Mode)
# Description: Robot waves with both arms using direct joint angles

# Execution parameters
control_mode: 'joint'  # Use direct joint angles (no IK)
synchronized: true  # Execute both arms in sync
interpolation_method: 'cubic'  # cubic, linear, or quintic
steps_per_segment: 50
total_duration: 5.0  # Total time for entire gesture in seconds (distributed across all interpolated points)

# Right arm waypoints (joint angles in radians)
# Format: [q1, q2, q3, q4] - Waving motion
right_arm_waypoints:
  - [0.6, 0.7, -1.2, 0.4]    # Start position
  - [0.8, 1.0, -1.5, 0.6]    # Wave up
  - [0.6, 0.7, -1.2, 0.4]    # Wave down
  - [0.8, 1.0, -1.5, 0.6]    # Wave up again
  - [0.6, 0.7, -1.2, 0.4]    # Return to start

# Left arm waypoints (joint angles in radians)
# Format: [q1, q2, q3, q4] - Waving motion (mirrored)
left_arm_waypoints:
  - [-0.6, -0.7, 1.2, -0.4]   # Start position
  - [-0.8, -1.0, 1.5, -0.6]   # Wave up
  - [-0.6, -0.7, 1.2, -0.4]   # Wave down
  - [-0.8, -1.0, 1.5, -0.6]   # Wave up again
  - [-0.6, -0.7, 1.2, -0.4]   # Return to start
