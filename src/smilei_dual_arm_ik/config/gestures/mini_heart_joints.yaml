# Gesture: Mini Heart (Joint Mode)
# Description: A mini-heart gesture made with both arms using direct joint angles

# Execution parameters
control_mode: 'joint'  # Use direct joint angles (no IK)
synchronized: false  # Independent arm motion
interpolation_method: 'cubic'
steps_per_segment: 15
total_duration: 2.5  # Total time for entire gesture in seconds

# Right arm waypoints (joint angles in radians)
# Format: [q1, q2, q3, q4] - Forms the right side of heart
right_arm_waypoints:
  - [0.4, 0.5, -1.0, 0.3]   # Bottom of heart
  - [0.6, 0.8, -1.4, 0.4]   # Right curve up
  - [0.8, 1.0, -1.6, 0.2]   # Top right peak
  - [0.7, 0.9, -1.3, 0.1]   # Down from peak
  - [0.6, 0.7, -1.1, 0.2]   # Mid-right side
  - [0.5, 0.6, -0.9, 0.3]   # Back to bottom

# Left arm waypoints (joint angles in radians)
# Format: [q1, q2, q3, q4] - Forms the left side of heart (mirrored)
left_arm_waypoints:
  - [-0.4, -0.5, 1.0, -0.3]  # Bottom of heart
  - [-0.6, -0.8, 1.4, -0.4]  # Left curve up
  - [-0.8, -1.0, 1.6, -0.2]  # Top left peak
  - [-0.7, -0.9, 1.3, -0.1]  # Down from peak
  - [-0.6, -0.7, 1.1, -0.2]  # Mid-left side
  - [-0.5, -0.6, 0.9, -0.3]  # Back to bottom
