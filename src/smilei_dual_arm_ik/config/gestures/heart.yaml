# Gesture: Heart
# Description: Robot points forward with right arm

# Execution parameters
synchronized: false  # Independent arm motion
interpolation_method: 'cubic'
steps_per_segment: 50

# Right arm waypoints (pointing gesture)
right_arm_waypoints:
  - {x: 0.160, y: 0.020, z: 0.460}  #
  - {x: 0.280, y: 0.030, z: 0.460}    # 
  - {x: 0.300, y: 0.070, z: 0.350}   # 
  - {x: 0.210, y: 0.070, z: 0.220}  # 
  - {x: 0.170, y: 0.040, z: 0.185} #

# Left arm waypoints (stays in rest position)
left_arm_waypoints:
  - {x: -0.160, y: 0.020, z: 0.460}
  - {x: -0.280, y: 0.030, z: 0.460}
  - {x: -0.300, y: 0.070, z: 0.350}
  - {x: -0.210, y: 0.070, z: 0.220}
  - {x: -0.170, y: 0.040, z: 0.185}
